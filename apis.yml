name: BlackBuck
description: 'BlackBuck, operated by Zinka Logistics Solutions and incorporated in 2015, runs India''s
  largest digital trucking platform, digitizing the truck-operator lifecycle for roughly a million
  truck operators (about 28% of India''s truckers) across 100,000+ villages. Its super-app spans a
  loads marketplace, FASTag toll payments, fuel, GPS/telematics, vehicle and working-capital financing,
  and a used-trucks marketplace. Listed on the NSE as BLACKBUCK since November 2024, the company was
  surfaced as a portfolio company of Accel and added to the API Evangelist network. No public developer
  program, API documentation, or OpenAPI surface was found during enrichment; this profile carries the
  company identity plus a probed domain-security posture.'
